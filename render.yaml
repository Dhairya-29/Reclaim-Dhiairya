# Render blueprint for the Reclaim API (render.com → New → Blueprint → pick this repo).
services:
  - type: web
    name: reclaim-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GROQ_API_KEY
        sync: false # Render asks you for this; it never goes in the repo
      - key: ALLOWED_ORIGINS
        value: https://reclaimyourself.netlify.app
      # To switch to Claude later, add ANTHROPIC_API_KEY in the Render dashboard (it takes priority).
